name: Build and publish

on:
  push:
    branches:
      - main
    paths:
      - act-4-cybersecurity-engineer/backend/**
      - act-4-cybersecurity-engineer/database/**
      - act-4-cybersecurity-engineer/frontend/**
      - .github/workflows/publish-act-4.yml

permissions:
  contents: write
  packages: write

env:
  ACT: act-4-cybersecurity-engineer

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install -r ${ACT}/backend/requirements.txt
      - run: python -m unittest discover -s ${ACT}/backend -v

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: image
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./act-4-cybersecurity-engineer/frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.base }}/frontend:${{ github.sha }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./act-4-cybersecurity-engineer/backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.base }}/backend:${{ github.sha }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./act-4-cybersecurity-engineer/database
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.base }}/database:${{ github.sha }}

      - name: Update manifests
        env:
          BASE: ${{ steps.image.outputs.base }}
          TAG: ${{ github.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          K=${ACT}/kubernetes
          sed -i -E "s@image: .*(tutorial-frontend|/frontend):.*@image: ${BASE}/frontend:${TAG}@; s@image: .*(tutorial-backend|/backend):.*@image: ${BASE}/backend:${TAG}@" $K/app/04-deployments.yaml
          sed -i -E "s@image: .*(tutorial-database|/database):.*@image: ${BASE}/database:${TAG}@" $K/app/03-postgres.yaml
          sed -i -E "s|(source-revision: ).*|\1${TAG}|" $K/app/03-postgres.yaml $K/app/04-deployments.yaml
          sed -i -E "s|repoURL: .*|repoURL: ${REPO_URL}|" $K/argocd/applications/*.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $K
          git diff --cached --quiet || git commit -m "chore: update application images"
          git push
