name: Build and publish

on:
  push:
    branches:
      - main
    paths:
      - act-3-devops-engineer/backend/**
      - act-3-devops-engineer/database/**
      - act-3-devops-engineer/frontend/**
      - .github/workflows/publish-act-3.yml

permissions:
  contents: write
  packages: write

env:
  ACT: act-3-devops-engineer

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r ${ACT}/backend/requirements.txt
      - run: python -m unittest discover -s ${ACT}/backend -v

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - id: image
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./act-3-devops-engineer/frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.base }}/frontend:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ./act-3-devops-engineer/backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.base }}/backend:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ./act-3-devops-engineer/database
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.base }}/database:${{ github.sha }}

      - name: Update manifests
        env:
          BASE: ${{ steps.image.outputs.base }}
          TAG: ${{ github.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          K=${ACT}/kubernetes
          sed -i -E "s@image: .*(tutorial-frontend|/frontend):.*@image: ${BASE}/frontend:${TAG}@; s@image: .*(tutorial-backend|/backend):.*@image: ${BASE}/backend:${TAG}@" $K/app/04-deployments.yaml
          sed -i -E "s@image: .*(tutorial-database|/database):.*@image: ${BASE}/database:${TAG}@" $K/app/03-postgres.yaml
          sed -i -E "s|(source-revision: ).*|\1${TAG}|" $K/app/03-postgres.yaml $K/app/04-deployments.yaml
          sed -i -E "s|repoURL: .*|repoURL: ${REPO_URL}|" $K/argocd/applications/*.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $K
          git diff --cached --quiet || git commit -m "chore: update application images"
          git push
