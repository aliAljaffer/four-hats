apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tutorial-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aliAljaffer/minikube-project-solved.git
    targetRevision: main
    path: act-3-devops-engineer/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
