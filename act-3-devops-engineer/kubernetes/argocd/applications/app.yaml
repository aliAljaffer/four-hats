apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tutorial-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aliAljaffer/minikube-project-solved.git
    targetRevision: main
    path: act-3-devops-engineer/kubernetes/app
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
