apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app.kubernetes.io/name: load-generator
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-generator
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: load-generator
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - while true; do curl -fsS 'http://backend.app.svc.cluster.local:8000/api/demo/work?units=5000000' >/dev/null; done
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
