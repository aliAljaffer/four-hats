apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - prometheus.yaml
  - grafana.yaml
  - alertmanager.yaml
configMapGenerator:
  - name: tutorial-dashboard
    files:
      - grafana-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: grafana-dashboard
